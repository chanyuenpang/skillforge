<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SkillForge Studio</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="side-rail">
        <div class="brand-block">
          <div class="brand-mark">SF</div>
          <div>
            <p class="eyebrow">SkillForge Studio</p>
            <h1>运营工作台</h1>
          </div>
        </div>
        <nav class="nav-stack" aria-label="Primary">
          <button class="nav-pill is-active" data-route="overview">Overview</button>
          <button class="nav-pill" data-route="skills">Skills</button>
          <button class="nav-pill" data-route="runs">Runs</button>
        </nav>
        <div class="rail-note">
          <p>更像产品后台，而不是技术控制台。</p>
        </div>
      </aside>

      <main class="workspace">
        <header class="hero-panel">
          <div class="hero-copy">
            <p class="eyebrow">Skill inventory + run visibility</p>
            <h2 id="hero-title">把技能资产和真实运行放到同一张桌面上。</h2>
            <p id="hero-subtitle">
              先看当前有哪些技能、它们大概在说什么，再回到每一次 run 的输入、输出与命中链路。
            </p>
          </div>
          <div class="hero-glow" aria-hidden="true"></div>
        </header>

        <section id="overview-view" class="page-view is-active" aria-label="Overview"></section>
        <section id="skills-view" class="page-view" aria-label="Skills"></section>
        <section id="runs-view" class="page-view" aria-label="Runs"></section>
      </main>
    </div>

    <div id="detail-drawer" class="detail-drawer" hidden>
      <div class="drawer-backdrop" data-close-drawer></div>
      <div class="drawer-panel">
        <button class="drawer-close" type="button" data-close-drawer>Close</button>
        <div id="drawer-content"></div>
      </div>
    </div>

    <template id="empty-state-template">
      <div class="empty-state">
        <h3>这里还没有可展示的内容</h3>
        <p>如果你刚开始搭建环境，等真实索引或运行记录积累后，这里会自然充实起来。</p>
      </div>
    </template>

    <script type="module" src="/app.js"></script>
  </body>
</html>

fixtureId: coding-agent-workflow
fixtureVersion: 0.1.0
kind: skill-spec
profile: executor-coding
skill:
  name: coding-agent-workflow
  version: 1.0.0
  title: 编码代理工作流
  description: 多专家协同体系中的核心执行者，负责将抽象需求转化为可运行的代码实现。
  triggerPhrases:
    - coding agent
    - coding-agent-workflow
    - 代码实现
    - 修复 bug
    - 重构
    - 集成
inputs:
  required:
    - taskId
    - objective
    - scope
  optional:
    - blockedBy
    - implementationNotes
    - verificationPlan
outputs:
  primary: implementationReport
  format: markdown
  requiredSections:
    - summary
    - filesChanged
    - keyChanges
    - verification
    - caveats
boundaries:
  allowed:
    - 创建和修改代码文件
    - 执行 lint / tsc / tests 验证
    - 集成依赖与解决冲突
    - 按任务状态推进实现与完成
  denied:
    - 任务规划职责
    - 代码审查职责
    - 把验证与实现混成一个任务定义
    - 外部消息或自动扩散操作
permissions:
  network: false
  externalSend: false
  fileRead: true
  fileWrite: false
  destructiveOperations: false
  privatePathRead: false
dependencies:
  noneDeclared: true
  items: []
riskPoints:
  - 任务定义不清会导致实现偏航。
  - 与其他 agent 共享文件时容易产生冲突。
  - 验证缺失会让实现表面完成但不可用。
checklist:
  structure: 包含输入、输出、边界与实现报告结构。
  trigger: 覆盖 coding agent、代码实现、修复 bug、重构、集成。
  boundary: 明确禁止规划与审查职责。
  dependency: 无外部依赖。
  risk: 明确任务不清、文件冲突与验证缺失风险。
  compatibility: 适配静态 MVP 验证。
  replay: 回放用例需包含 intent 与 expected behavior。

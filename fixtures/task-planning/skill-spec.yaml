fixtureId: task-planning
fixtureVersion: 0.1.0
kind: skill-spec
profile: leader-planning
skill:
  name: task-planning
  version: 1.0.0
  title: 任务规划技能
  description: 指导 Leader Agent 进行复杂任务的分解、调度与执行规划。
  triggerPhrases:
    - task planning
    - 任务规划
    - 规划一下
    - 拆分任务
    - 调度
    - blockedBy
inputs:
  required:
    - objective
    - scope
    - inputs
    - expected_output
    - done_criteria
  optional:
    - dependencies
    - riskNotes
outputs:
  primary: planDocument
  format: json
  requiredSections:
    - title
    - status
    - summary
    - tasks
    - riskPoints
boundaries:
  allowed:
    - 拆解复杂任务并定义 blockedBy
    - 区分实现、验证、审查三类任务
    - 记录共享基础件与风险点
    - 先确认外部依赖已现场验证
  denied:
    - 直接实现代码
    - 把多种职责混到一个任务里
    - 基于记忆假设外部接口行为
    - 在未验证时派发依赖外部工具的任务
permissions:
  network: false
  externalSend: false
  fileRead: true
  fileWrite: false
  destructiveOperations: false
  privatePathRead: false
dependencies:
  noneDeclared: true
  items: []
riskPoints:
  - 外部依赖能力若未现场验证，计划会误判。
  - 任务粒度过大时会破坏原子性。
  - 共享文件未串行化会产生调度冲突。
checklist:
  structure: 包含目标、范围、输入、输出、完成标准与依赖。
  trigger: 覆盖 task planning、任务规划、拆分任务、blockedBy。
  boundary: 明确禁止实现、验证、审查混合。
  dependency: 无外部依赖。
  risk: 明确外部依赖、粒度与冲突风险。
  compatibility: 适配静态 MVP 验证。
  replay: 回放用例需包含 intent 与 expected behavior。

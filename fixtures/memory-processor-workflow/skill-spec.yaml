fixtureId: memory-processor-workflow
fixtureVersion: 0.1.0
kind: skill-spec
profile: standard
skill:
  name: memory-processor-workflow
  version: 0.1.0
  title: 记忆处理 Subagent
  description: 仅处理单一来源 MEMORY.md，逐条下沉到知识库，并按 Top30 规则回写。
  triggerPhrases:
    - memory processor
    - memory-processor-workflow
    - MEMORY.md
    - 记忆下沉
    - knowledge 去重
    - Top30
inputs:
  required:
    - source
    - memoryFile
  optional:
    - memoryContent
    - projectHint
outputs:
  primary: processingResult
  format: json
  requiredSections:
    - source
    - success
    - processed_count
    - created
    - merged
    - failure_reason
boundaries:
  allowed:
    - 读取当前来源的 MEMORY.md
    - 逐条处理 MEMORY 表格条目
    - 为当前记忆选择或更新对应 knowledge
    - 执行 count 累加、更新时间更新与 Top30 回写
  denied:
    - 扫描其他来源 MEMORY
    - 用整份摘要替代逐条处理
    - 处理来源之外的记忆
    - 访问网络、外发消息或调用外部服务
    - 执行破坏性系统修改
permissions:
  network: false
  externalSend: false
  fileRead: true
  fileWrite: true
  destructiveOperations: false
  privatePathRead: true
dependencies:
  noneDeclared: true
  items: []
privacy:
  sourceTypes:
    - private
  realPrivateRepositoryDataAllowed: false
  realCustomerDataAllowed: false
compatibility:
  staticValidatorOnly: true
  runtimeReplay: pending
  crossPlatform: pending
  crossModel: pending
  ci: pending
checklist:
  structure: 定义单一来源输入、JSON 输出、边界与权限，profile 为 standard。
  trigger: 覆盖 memory processor、MEMORY.md、记忆下沉、knowledge 去重、Top30。
  boundary: 明确只处理当前来源，不扫描其他来源，不用摘要替代逐条处理。
  dependency: 无外部依赖。
  privacy: 只允许处理当前来源私有 MEMORY.md。
  compatibility: 适配静态 MVP 验证。
